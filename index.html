        <p>这个页面以终端字符动画讲述一段恋爱时间线。你的浏览器没有启用 JavaScript，以下是完整内容：</p>
        <ol>
          <li>
            <time datetime="2024-09">2024 年 9 月</time> —— 在 bilibili 的直播间相遇。她走进我门可罗雀的直播间，看我默默玩明日方舟，给我打赏支持。
          </li>
          <li>
            <time datetime="2024-09">2024 年 9 月</time> 起 —— 她放心地把自己的游戏账号交给我代练，每次都给我定价额外的钱。我倍感温暖。
          </li>
          <li>
            <time datetime="2026-02">2026 年 2 月</time> —— 她主动出击，在微信提出要和我做更进一步的朋友。我们之间的交流不再限于游戏。
          </li>
          <li>
            <time datetime="2026-03-08">2026 年 3 月 8 日</time> —— 她再次出击，主动向我表白，我接受了。我的第一个正式的女朋友，不再虚席。
          </li>
          <li>
            <time datetime="2026-03-20">2026 年 3 月 20 日</time> —— 她在公司请了长假，一个人偷摸从宁波坐高铁来合肥找我奔现，同居。
          </li>
          <li>
            <time datetime="2026-05-12">2026 年 5 月 12 日</time> —— 我遭遇车祸，她在医院悉心照料我日常起居。所有的辛苦我都看在眼里。
          </li>
          <li>
            <time datetime="2026-10-05">2026 年 10 月 5 日</time> —— 我们第一次一起旅游，到了南京，珍惜着这来之不易的时光。
          </li>
        </ol>
        <p>未来不可知，但我满心期待。</p>
