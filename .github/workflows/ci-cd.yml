name: CI/CD

on:
  push:
    branches: [main, master, prod]
  pull_request:
    branches: [main, master, prod]
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的构建
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# 动作版本一律取「跑在 node24 上的最低大版本」。
# 更低的版本仍声明 node20，会被 runner 强制迁移并刷一屏弃用警告。
# 升级时请只升到满足 node24 的那个大版本，不要盲目追最新 ——
# 大版本之间的破坏性变更与本次修复无关，没必要一并承担。
jobs:
  verify:
    name: 类型检查 · Lint · 单测 · 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 类型检查是**独立步骤**，不只依赖编辑器 ——
      # 这是 TS 7 原生编译器生态风险的兜底（详见 docs/DECISIONS.md）
      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build-only

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # public/.nojekyll 是**点文件**，而这个动作默认把它排除在产物之外，
          # 于是部署上去的站点会被 Jekyll 处理。必须显式带上。
          include-hidden-files: true

  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    # 部署只等 verify —— 取类型检查 / Lint / 单测 / 构建这四道闸。
    #
    # E2E **不在流水线里**（见 ADR-017）：它在本地跑，不进 CI。
    # 于是部署出去的是「验证过类型、Lint、单测、构建，但没有跑过端到端用例」
    # 的产物 —— 这是站主明确选择的行为，不是配置疏漏。
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/prod')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
